<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sample HTML with inline CSS</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; line-height: 1.6; }
  h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: .4rem; }
  h2 { color: #34495e; margin-top: 2rem; }
  .card { background: #f7f9fb; border: 1px solid #e1e8ed; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .badge { display: inline-block; background: #3498db; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: .85rem; }
  a { color: #2980b9; }
  code { background: #eef2f5; padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<h1>Sample HTML <span class="badge">CSS</span></h1>
<p>This document demonstrates inline <code>&lt;style&gt;</code> blocks with typography, layout, and components.</p>
<div class="card">
  <h2>Card heading</h2>
  <p>Cards are reusable layout containers. Edit the CSS in the <code>&lt;head&gt;</code> to customize.</p>
</div>
<div class="card">
  <h2>Another card</h2>
  <p>You can add as many as you need. <a href="#">Anchor links</a> are styled too.</p>
</div>
</body>
</html>
